<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elie3MDigital - Gestion</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    header img { height: 50px; }
    header h1 { font-size: 20px; margin: 0; color: #1e4d8c; }
    main { padding: 16px; max-width: 900px; margin: auto; }
    section { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin-top: 0; color: #1e4d8c; font-size: 18px; }
    h3 { font-size: 15px; color: #444; margin: 16px 0 8px; }
    input, select, button { padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; font-size: 16px; }
    button { background: #1e4d8c; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #163a6b; }
    button.secondaire { background: #6c757d; }
    button.danger { background: #b02a37; width: auto; padding: 4px 10px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
    .total { text-align: right; font-size: 18px; font-weight: bold; margin: 12px 0; }
    .ligne-form { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .deux-colonnes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #message { display: none; padding: 10px; margin-bottom: 12px; border-radius: 4px; }
    #message.ok { display: block; background: #d4edda; }
    #message.err { display: block; background: #f8d7da; }
    #section-apercu { display: none; }
    #facture-imprimable { background: #fff; padding: 20px; border: 1px solid #ddd; }
    #facture-imprimable table td, #facture-imprimable table th { padding: 6px; }

    @media print {
      body * { visibility: hidden; }
      #facture-imprimable, #facture-imprimable * { visibility: visible; }
      #facture-imprimable { position: absolute; left: 0; top: 0; width: 100%; border: none; }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo Elie3MDigital">
    <h1>Gestion commerciale</h1>
  </header>

  <main>
    <div id="message"></div>

    <section>
      <h2>Produits et prestations</h2>
      <form id="form-produit">
        <input id="p-nom" placeholder="Nom du produit ou de la prestation *" required>
        <div class="deux-colonnes">
          <select id="p-type" required>
            <option value="produit">Produit</option>
            <option value="prestation">Prestation</option>
          </select>
          <input id="p-unite" placeholder="Unité (ex : pièce, heure, forfait)" value="unité">
        </div>
        <input id="p-prix" type="number" step="0.01" min="0" placeholder="Prix unitaire *" required>
        <input id="p-description" placeholder="Description">
        <button type="submit">Ajouter</button>
      </form>
      <h3>Liste</h3>
      <table>
        <thead><tr><th>Nom</th><th>Type</th><th>Prix</th></tr></thead>
        <tbody id="liste-produits"></tbody>
      </table>
    </section>

    <section>
      <h2>Nouveau client</h2>
      <form id="form-client">
        <input id="c-nom" placeholder="Nom du client *" required>
        <input id="c-email" type="email" placeholder="Email">
        <input id="c-telephone" placeholder="Téléphone">
        <input id="c-adresse" placeholder="Adresse">
        <button type="submit">Ajouter le client</button>
      </form>
      <h3>Liste des clients</h3>
      <table>
        <thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th></tr></thead>
        <tbody id="liste-clients"></tbody>
      </table>
    </section>

    <section>
      <h2>Nouvelle facture</h2>
      <form id="form-facture">
        <input id="f-numero" placeholder="Numéro de facture (ex : FAC-001) *" required>
        <select id="f-client" required></select>

        <h3>Lignes de la facture</h3>
        <div class="ligne-form">
          <select id="f-produit"></select>
          <input id="f-quantite" type="number" step="0.01" min="0.01" value="1" placeholder="Quantité">
        </div>
        <button type="button" id="btn-ajouter-ligne" class="secondaire">Ajouter la ligne</button>

        <table>
          <thead><tr><th>Désignation</th><th>Qté</th><th>Prix</th><th>Total</th><th></th></tr></thead>
          <tbody id="lignes-facture"></tbody>
        </table>

        <div class="total">Total : <span id="f-total">0.00</span></div>
        <button type="submit">Enregistrer la facture</button>
      </form>
    </section>

    <section>
      <h2>Factures</h2>
      <table>
        <thead><tr><th>Numéro</th><th>Client</th><th>Date</th><th>Montant</th><th></th></tr></thead>
        <tbody id="liste-factures"></tbody>
      </table>
    </section>

    <section id="section-apercu">
      <h2>Aperçu de la facture</h2>
      <div id="facture-imprimable"></div>
      <button type="button" id="btn-imprimer">Imprimer</button>
      <button type="button" id="btn-fermer-apercu" class="secondaire">Fermer l'aperçu</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
