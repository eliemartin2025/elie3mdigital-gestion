<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elie3MDigital - Gestion</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    header img { height: 50px; }
    header h1 { font-size: 20px; margin: 0; color: #1e4d8c; }
    main { padding: 16px; max-width: 900px; margin: auto; }
    section { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin-top: 0; color: #1e4d8c; font-size: 18px; }
    input, select, button { padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; font-size: 16px; }
    button { background: #1e4d8c; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #163a6b; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
    #message { display: none; padding: 10px; margin-bottom: 12px; border-radius: 4px; }
    #message.ok { display: block; background: #d4edda; }
    #message.err { display: block; background: #f8d7da; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo Elie3MDigital">
    <h1>Gestion commerciale</h1>
  </header>

  <main>
    <div id="message"></div>

    <section>
      <h2>Nouveau client</h2>
      <form id="form-client">
        <input id="c-nom" placeholder="Nom du client *" required>
        <input id="c-email" type="email" placeholder="Email">
        <input id="c-telephone" placeholder="Téléphone">
        <input id="c-adresse" placeholder="Adresse">
        <button type="submit">Ajouter le client</button>
      </form>
    </section>

    <section>
      <h2>Clients</h2>
      <table>
        <thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th></tr></thead>
        <tbody id="liste-clients"></tbody>
      </table>
    </section>

    <section>
      <h2>Nouvelle facture</h2>
      <form id="form-facture">
        <input id="f-numero" placeholder="Numéro de facture (ex : FAC-001) *" required>
        <select id="f-client" required></select>
        <input id="f-montant" type="number" step="0.01" min="0" placeholder="Montant total *" required>
        <button type="submit">Créer la facture</button>
      </form>
    </section>

    <section>
      <h2>Factures</h2>
      <table>
        <thead><tr><th>Numéro</th><th>Client</th><th>Date</th><th>Montant</th></tr></thead>
        <tbody id="liste-factures"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
